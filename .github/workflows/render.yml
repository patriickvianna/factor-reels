# Robô de Reels da Factor Ofertas: a cada 15 min olha a fila no Supabase e, se houver Reels, monta e publica.
name: Reels
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["render/**", ".github/workflows/render.yml", "test/run.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: reels
  cancel-in-progress: false
env:
  FN_URL: https://fojvvrtctfowdhdgmske.supabase.co/functions/v1/reels-runner
jobs:
  olhar-fila:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.peek.outputs.jobs }}
      cleanup: ${{ steps.peek.outputs.cleanup }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - name: Tem Reels na fila?
        id: peek
        run: |
          R=$(.github/scripts/api.sh '{"action":"peek"}')
          echo "$R"
          echo "jobs=$(echo "$R" | jq -r '.jobs // 0')" >> "$GITHUB_OUTPUT"
          echo "cleanup=$(echo "$R" | jq -r '.cleanup // 0')" >> "$GITHUB_OUTPUT"
      - name: Manter o agendamento ativo (o GitHub pausa agendas paradas há 60 dias)
        if: github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true

  montar:
    needs: olhar-fila
    if: needs.olhar-fila.outputs.jobs != '0' || needs.olhar-fila.outputs.cleanup != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      KOKORO_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: render/requirements.txt }
      - name: Ferramentas (FFmpeg e eSpeak para a pronúncia)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - name: Modelo de voz em cache
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - name: Baixar o modelo de voz Kokoro (só na primeira vez)
        run: |
          mkdir -p models
          [ -s models/kokoro-v1.0.onnx ] || curl -sSL --fail -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL --fail -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models
      - run: pip install -r render/requirements.txt
      - name: Navegador em cache
        uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.48.0 }
      - run: python -m playwright install --with-deps chromium
      - name: Biblioteca de música
        run: |
          mkdir -p music/files
          if [ -f music/manifest.json ]; then gh release download musica -p '*.mp3' -D music/files --skip-existing || echo "sem músicas (o vídeo sai só com voz)"; fi
          ls music/files | head -20
      - name: Montar os Reels
        run: python render/main.py 2>&1 | tee /tmp/run.log
      - name: Avisar falha geral
        if: failure()
        run: |
          jq -n --arg t "$(tail -c 2500 /tmp/run.log 2>/dev/null || echo 'falhou antes de rodar')" '{action:"log",agent:"reels",step:"workflow",ok:false,text:$t}' > /tmp/body.json
          .github/scripts/api.sh "$(cat /tmp/body.json)" || true
