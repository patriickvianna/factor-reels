# Robô de Reels da Factor Ofertas: a cada 15 min olha a fila no Supabase e, se houver Reels, monta e publica.
name: Reels
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["render/**", ".github/workflows/render.yml", "test/run.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
  actions: write
concurrency:
  group: reels
  cancel-in-progress: false
env:
  FN_URL: https://fojvvrtctfowdhdgmske.supabase.co/functions/v1/reels-runner
jobs:
  olhar-fila:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.peek.outputs.jobs }}
      cleanup: ${{ steps.peek.outputs.cleanup }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - name: Tem Reels na fila?
        id: peek
        run: |
          R=$(.github/scripts/api.sh '{"action":"peek"}')
          echo "$R"
          echo "jobs=$(echo "$R" | jq -r '.jobs // 0')" >> "$GITHUB_OUTPUT"
          echo "cleanup=$(echo "$R" | jq -r '.cleanup // 0')" >> "$GITHUB_OUTPUT"
      - name: Manter o agendamento ativo (o GitHub pausa agendas paradas há 60 dias)
        if: github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true

  montar:
    needs: olhar-fila
    if: needs.olhar-fila.outputs.jobs != '0' || needs.olhar-fila.outputs.cleanup != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      KOKORO_DIR: ${{ github.workspace }}/models
      REELS_ASR_ENFORCE: "1"   # voz pouco clara barra o vídeo
      REELS_MAX_WER: "0.35"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: remotion/package-lock.json }
      - name: Ferramentas (FFmpeg e eSpeak para a pronúncia)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - name: Modelos em cache (vozes e conferência da fala)
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: modelos-v2-chatterbox-kokoro-whisper
      - name: Ambientes Python em cache
        id: venvs
        uses: actions/cache@v4
        with:
          path: |
            /opt/venv-main
            /opt/venv-kokoro
          key: venvs-v2-${{ steps.py.outputs.python-version }}-${{ hashFiles('render/requirements.txt') }}
      - name: Instalar a voz e a conferência (só na primeira vez)
        if: steps.venvs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo mkdir -p /opt/venv-main /opt/venv-kokoro && sudo chown -R "$USER" /opt/venv-main /opt/venv-kokoro
          python -m venv /opt/venv-main
          /opt/venv-main/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /opt/venv-main/bin/pip install -q -r render/requirements.txt
          python -m venv /opt/venv-kokoro
          /opt/venv-kokoro/bin/pip install -q kokoro-onnx==0.4.9 soundfile
      - name: Modelo Kokoro (reserva)
        run: |
          mkdir -p models
          [ -s models/kokoro-v1.0.onnx ] || curl -sSL --fail -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL --fail -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Motor de animação (Remotion)
        working-directory: remotion
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Voz do PTK (cifrada)
        shell: bash
        run: .github/scripts/voz-ptk.sh
      - name: Biblioteca de música
        run: |
          mkdir -p music/files
          if [ -f music/manifest.json ]; then gh release download musica -p '*.mp3' -D music/files --skip-existing || echo "sem músicas (o vídeo sai só com voz)"; fi
          ls music/files | head -20
      - name: Montar os Reels
        shell: bash
        env:
          KOKORO_PY: /opt/venv-kokoro/bin/python
          REMOTION_CONCURRENCY: "4"
        run: /opt/venv-main/bin/python render/main.py 2>&1 | grep -v -E 'Sampling|it/s\]' | tee /tmp/run.log
      - name: Avisar falha geral
        if: failure()
        run: |
          jq -n --arg t "$(tail -c 2500 /tmp/run.log 2>/dev/null || echo 'falhou antes de rodar')" '{action:"log",agent:"reels",step:"workflow",ok:false,text:$t}' > /tmp/body.json
          .github/scripts/api.sh "$(cat /tmp/body.json)" || true
