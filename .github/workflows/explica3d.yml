# Reels explicativo 3D (GUT #112): render dividido em várias máquinas do GitHub, em paralelo.
# 1) "preparar": gera a voz, o instante de cada palavra e os cues dos movimentos;
# 2) "partes": N máquinas renderizam um pedaço cada (mesmo vídeo, quadros diferentes);
# 3) "juntar": cola os pedaços sem recodificar, põe a voz e guarda como Release.
# Por enquanto é disparado à mão (amostra). Vira automático depois que o PTK aprovar o modelo.
name: Explica 3D
on:
  workflow_dispatch:
    inputs:
      tema: { description: "Tema (airfryer ou coracao)", default: "airfryer" }
      partes: { description: "Em quantas máquinas dividir (4 a 8)", default: "6" }
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      partes: ${{ steps.m.outputs.partes }}
    env:
      KOKORO_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with: { python-version: "3.11" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      # mesmos caches do robô de Reels: a voz da Dora (Chatterbox) e o Whisper já ficam baixados
      - name: Modelos em cache (vozes e conferência da fala)
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: modelos-v2-chatterbox-kokoro-whisper
      - name: Ambientes Python em cache
        id: venvs
        uses: actions/cache@v4
        with:
          path: |
            /opt/venv-main
            /opt/venv-kokoro
          key: venvs-v2-${{ steps.py.outputs.python-version }}-${{ hashFiles('render/requirements.txt') }}
      - name: Instalar a voz e a conferência (só na primeira vez)
        if: steps.venvs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo mkdir -p /opt/venv-main /opt/venv-kokoro && sudo chown -R "$USER" /opt/venv-main /opt/venv-kokoro
          python -m venv /opt/venv-main
          /opt/venv-main/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /opt/venv-main/bin/pip install -q -r render/requirements.txt
          python -m venv /opt/venv-kokoro
          /opt/venv-kokoro/bin/pip install -q kokoro-onnx==0.4.9 soundfile
      - name: Voz da Dora, tempo de cada palavra e trilha
        shell: bash
        run: |
          /opt/venv-main/bin/pip install -q scipy
          EXPLICA_VOZ=cb_dora /opt/venv-main/bin/python render/explica_amostra.py "${{ inputs.tema }}" out
      - id: m
        run: echo "partes=$(seq -s, 1 ${{ inputs.partes }} | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: preparo, path: out/ }

  partes:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        parte: ${{ fromJSON(needs.preparar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: remotion/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: preparo, path: out }
      - name: Renderizar a parte ${{ matrix.parte }}
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund && npx remotion browser ensure
          sed -i "s|\"audio_file\": \"[^\"]*\"|\"audio_file\": \"$GITHUB_WORKSPACE/out/voz.wav\"|" ../out/props.json
          REMOTION_GL=angle REMOTION_CONCURRENCY=4 node render-explica.mjs ../out/props.json ../p${{ matrix.parte }}.mp4 --part=${{ matrix.parte }}/${{ inputs.partes }}
      - uses: actions/upload-artifact@v4
        with: { name: "parte-${{ matrix.parte }}", path: "p${{ matrix.parte }}.mp4" }

  juntar:
    needs: partes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "parte-*", path: partes, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: preparo, path: out }
      - name: Juntar e pôr a voz
        run: bash remotion/join-explica.sh partes out/voz.wav "explica-${{ inputs.tema }}.mp4"
      - name: Guardar como Release
        run: |
          tag="explica-${{ inputs.tema }}-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" "explica-${{ inputs.tema }}.mp4" --title "Amostra 3D: ${{ inputs.tema }}" --notes "Reels explicativo 3D (GUT #112)." --latest=false
