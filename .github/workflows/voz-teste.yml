# Teste de vozes (roda quando a pasta voz/ muda): Kokoro x Chatterbox, com tempos, no Release "voz-teste".
name: Voz teste
on:
  push:
    branches: [main]
    paths: ["voz/**", ".github/workflows/voz-teste.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
env:
  FN_URL: https://fojvvrtctfowdhdgmske.supabase.co/functions/v1/reels-runner
jobs:
  vozes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - name: Kokoro
        shell: bash
        run: |
          mkdir -p models out
          [ -s models/kokoro-v1.0.onnx ] || curl -sSL --fail -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL --fail -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python -m venv /tmp/vk && /tmp/vk/bin/pip install -q kokoro-onnx==0.4.9 soundfile
          /tmp/vk/bin/python voz/teste_kokoro.py out 2>&1 | tee /tmp/voz.log
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-mtl-v1 }
      - name: Chatterbox
        shell: bash
        run: |
          python -m venv /tmp/vc
          /tmp/vc/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/vc/bin/pip install -q chatterbox-tts==0.1.7
          nproc; /tmp/vc/bin/python voz/teste_chatterbox.py out 2>&1 | grep -v -E 'Warning|Sampling' | tee -a /tmp/voz.log
      - name: Conferir o que cada voz falou (Whisper)
        shell: bash
        run: |
          /tmp/vc/bin/pip install -q faster-whisper==1.1.1 requests
          /tmp/vc/bin/python voz/conferir.py out 2>&1 | grep -v Warning | tee -a /tmp/voz.log
      - name: Publicar amostras
        if: always()
        shell: bash
        run: |
          cd out && for f in *.wav; do ffmpeg -v error -y -i "$f" -ar 48000 -b:a 160k "${f%.wav}.mp3"; done
          gh release view voz-teste >/dev/null 2>&1 || gh release create voz-teste --title "Teste de vozes" --notes "Amostras de voz para comparar." --latest=false
          gh release upload voz-teste *.mp3 --clobber
      - name: Registrar
        if: always()
        run: |
          jq -n --arg t "$(tail -c 2500 /tmp/voz.log)" --argjson ok "${{ job.status == 'success' }}" '{action:"log",agent:"reels",step:"voz-teste",ok:$ok,text:$t}' > /tmp/body.json
          .github/scripts/api.sh "$(cat /tmp/body.json)" || true
